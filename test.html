// ====================== 初始化旭日图（一体化层次）======================
const chart = echarts.init(document.getElementById('main'));
const option = {
    tooltip: {
        trigger: 'item',
        formatter: function (params) {
            const d = params.data;
            if (d.origin) { // 菜系层：显示全部维度
                return `${d.name}<br/>
                        发源地：${d.origin}<br/>
                        味型：${d.taste}<br/>
                        辣度：${d.spicy}/5<br/>
                        历史：${d.history}年<br/>
                        流行度：${d.pop}分<br/>
                        技法丰富度：${d.skill}分<br/>
                        健康指数：${d.health}分<br/>
                        热量：${d.heat} kcal`;
            }
            return d.name; // 内层只显示名称
        }
    },
    series: [{
        type: 'sunburst',
        data: data,
        radius: ['15%', '90%'],
        label: {
            rotate: 'radial',
            fontSize: 14
        },
        emphasis: {
            focus: 'descendant'
        }
    }]
};
chart.setOption(option);

// 自适应
window.addEventListener('resize', () => chart.resize());
